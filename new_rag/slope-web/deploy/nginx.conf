# ══════════════════════════════════════════════════════════════════
#  边坡监测智能平台 · nginx 站点配置
#
#  角色：整个系统的**统一入口**。
#    * 静态资源（本文件所在目录的上一级 slope-web/）由 nginx 直接吐
#    * /api/   反代到 Java 业务域   (127.0.0.1:8080)
#    * /agent/ 反代到 Python Agent  (127.0.0.1:8000)
#
#  为什么用 nginx 同源反代而不是前端直连两个端口：
#    1. **没有跨域**：前端只跟一个来源说话，Java 侧不需要配 CORS，
#       也不会有预检请求；将来换域名也不用改前端代码。
#    2. **端口不外露**：8080/8000 可以只监听回环，外部只能通过 80 进来。
#    3. **统一超时与限流**：超时、缓冲、压缩这些策略集中在一层，好统一调。
#
#  启动（注意必须带 -p 指定 prefix，否则找不到 conf/mime.types 和 logs/temp）：
#    nginx.exe -p D:\develop_software\nginx-1.20.2 -c <本文件绝对路径>
#  重载：
#    nginx.exe -p D:\develop_software\nginx-1.20.2 -c <本文件绝对路径> -s reload
#  停止：
#    nginx.exe -p D:\develop_software\nginx-1.20.2 -c <本文件绝对路径> -s stop
# ══════════════════════════════════════════════════════════════════

worker_processes  2;
error_log  logs/slope-error.log  warn;
pid        logs/slope-nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format  slope  '$remote_addr - [$time_local] "$request" '
                       '$status $body_bytes_sent ${request_time}s '
                       'upstream=${upstream_addr} ut=${upstream_response_time}s';
    access_log  logs/slope-access.log  slope;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    client_max_body_size 4m;

    # 静态资源压缩。注意：**不要对 /agent/ 开压缩** ——
    # Agent 的回答是长文本且流式下发，压缩反而增加首字节延迟。
    gzip              on;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml;

    # 上游定义：显式声明便于统一调超时与失败转移
    upstream slope_java  { server 127.0.0.1:8080 max_fails=3 fail_timeout=10s; }
    upstream slope_agent { server 127.0.0.1:8000 max_fails=3 fail_timeout=30s; }

    server {
        listen       80;
        server_name  localhost 127.0.0.1;

        # 前端站点根目录（本文件在 slope-web/deploy/ 下，所以往上一级）
        root   C:/Users/Lenovo/Desktop/new_rag/slope-web;
        index  index.html;

        charset utf-8;

        # ── 安全响应头 ──
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer-when-downgrade always;

        # ── 前端静态资源 ──
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 静态资源缓存：文件名没带 hash，所以缓存期要短，
        # 不然改完 JS/CSS 用户刷不出来（调试期尤其难受）。
        location ~* \.(css|js)$ {
            expires 5m;
            add_header Cache-Control "public, must-revalidate";
        }
        location ~* \.(svg|png|jpg|ico|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public";
        }

        # ── Java 业务域 ──
        location /api/ {
            proxy_pass         http://slope_java/api/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            proxy_connect_timeout 5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }

        # ── Python Agent ──
        #
        # ⚠️ 这里是整个配置里最关键的一行：**proxy_read_timeout 必须放到 300s**。
        #    Agent 做一次多因素综合评估要连续调 5 个工具、跑 3 轮推理，
        #    实测约 95 秒（瓶颈是 qwen3 每轮要写约 2000 token 的思考）。
        #    nginx 默认 60s 会直接 504，而且**现象是"页面报超时但后端其实还在跑"**，
        #    非常难排查 —— 所以这里显式放宽，并在前端给了进度提示。
        location /agent/ {
            # 末尾的 / 会把 /agent/xxx 改写成 /xxx，正好对上 Python 侧的路由
            proxy_pass         http://slope_agent/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   Connection        "";

            proxy_connect_timeout 5s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;
            proxy_buffering       off;   # 不缓冲，让长回答尽早开始回传
            gzip                  off;
        }

        # ── 运维入口 ──
        location = /nginx-health {
            access_log off;
            return 200 "nginx ok\n";
            add_header Content-Type text/plain;
        }
    }
}

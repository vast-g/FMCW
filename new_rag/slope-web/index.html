<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>边坡监测智能平台</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- ══════════════ 顶栏 ══════════════ -->
<header class="topbar">
  <div class="brand">
    <svg viewBox="0 0 24 24" class="logo" aria-hidden="true">
      <path d="M3 20h18L12 4 3 20z" fill="none" stroke="currentColor" stroke-width="1.6"
            stroke-linejoin="round"/>
      <path d="M8.5 20l3.5-6 3.5 6" fill="none" stroke="currentColor" stroke-width="1.6"
            stroke-linejoin="round"/>
    </svg>
    <div>
      <h1>边坡监测智能平台</h1>
      <p class="sub">Java 业务域 · Python Agent · MySQL · Redis · Nginx</p>
    </div>
  </div>

  <div class="topbar-right">
    <!-- 服务健康：每个后端一个灯，坏了一眼看得出来 -->
    <div class="health" id="health">
      <span class="dot" data-svc="java" title="Java 业务域"></span>
      <span class="health-label">Java</span>
      <span class="dot" data-svc="agent" title="Python Agent"></span>
      <span class="health-label">Agent</span>
    </div>

    <div class="auth" id="auth">
      <input id="in-user" type="text" value="admin" placeholder="用户名" autocomplete="username">
      <input id="in-pass" type="password" value="admin123" placeholder="密码" autocomplete="current-password">
      <button id="btn-login" class="btn btn-primary">登录</button>
      <span id="who" class="who" hidden></span>
      <button id="btn-logout" class="btn btn-ghost" hidden>退出</button>
    </div>
  </div>
</header>

<!-- ══════════════ 主区 ══════════════ -->
<main class="grid">

  <!-- ── 告警 ── -->
  <section class="card span-2" id="card-alerts">
    <div class="card-head">
      <h2>告警事件</h2>
      <div class="card-tools">
        <label class="chk"><input type="checkbox" id="f-unacked" checked> 只看未确认</label>
        <button class="btn btn-sm" id="btn-alerts-refresh">刷新</button>
      </div>
    </div>
    <div class="card-body">
      <div class="alert-summary" id="alert-summary"></div>
      <div class="table-wrap">
        <table class="table" id="tbl-alerts">
          <thead>
            <tr><th>等级</th><th>点位</th><th>规则</th><th>实测 / 阈值</th><th>时间</th><th>状态</th><th></th></tr>
          </thead>
          <tbody><tr><td colspan="7" class="empty">登录后加载…</td></tr></tbody>
        </table>
      </div>
    </div>
  </section>

  <!-- ── 点位 ── -->
  <section class="card" id="card-sites">
    <div class="card-head">
      <h2>监测点位</h2>
      <div class="card-tools"><button class="btn btn-sm" id="btn-sites-refresh">刷新</button></div>
    </div>
    <div class="card-body">
      <div class="sites" id="sites"><p class="empty">登录后加载…</p></div>
    </div>
  </section>

  <!-- ── 点位分布示意 ── -->
  <section class="card" id="card-map">
    <div class="card-head">
      <h2>点位分布与告警态势</h2>
      <span class="hint">按经纬度投影 · 圈大小＝当前告警数</span>
    </div>
    <div class="card-body">
      <svg id="map" viewBox="0 0 400 260" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
  </section>

  <!-- ── 趋势 ── -->
  <section class="card span-2" id="card-trend">
    <div class="card-head">
      <h2>多因素趋势</h2>
      <div class="card-tools">
        <select id="sel-site" class="sel"></select>
        <select id="sel-metric" class="sel">
          <option value="displacement_mm">累计位移 (mm)</option>
          <option value="rainfall_mm">小时雨强 (mm/h)</option>
          <option value="pore_pressure_kpa">孔隙水压力 (kPa)</option>
          <option value="crack_width_mm">裂缝宽度 (mm)</option>
        </select>
      </div>
    </div>
    <div class="card-body">
      <svg id="chart" viewBox="0 0 720 220" preserveAspectRatio="none"></svg>
      <div class="chart-legend" id="chart-legend"></div>
    </div>
  </section>

  <!-- ── Agent 对话 ── -->
  <section class="card" id="card-chat">
    <div class="card-head">
      <h2>Agent 智能助手</h2>
      <span class="hint">判定归规则引擎，Agent 只做解释</span>
    </div>
    <div class="card-body chat-body">
      <div class="chat-log" id="chat-log">
        <div class="msg bot">
          <div class="bubble">可以直接问我：<br>
            · 现在边坡有没有滑坡风险？帮我综合判断一下<br>
            · 刚才是不是报警了？为什么报的？<br>
            · 孔隙水压力和滑坡是什么关系？
          </div>
        </div>
      </div>
      <div class="chat-input">
        <input id="in-q" type="text" placeholder="输入问题，回车发送…">
        <button class="btn btn-primary" id="btn-send">发送</button>
      </div>
    </div>
  </section>

  <!-- ── 规则 ── -->
  <section class="card" id="card-rules">
    <div class="card-head">
      <h2>告警规则</h2>
      <div class="card-tools">
        <span class="hint">改阈值后规则引擎立即按新值判定</span>
        <button class="btn btn-sm" id="btn-rules-refresh">刷新</button>
      </div>
    </div>
    <div class="card-body">
      <div class="table-wrap">
        <table class="table" id="tbl-rules">
          <thead><tr><th>编码</th><th>名称</th><th>阈值</th><th>等级</th><th>启用</th></tr></thead>
          <tbody><tr><td colspan="5" class="empty">登录后加载…</td></tr></tbody>
        </table>
      </div>
    </div>
  </section>

</main>

<div id="toast" class="toast" hidden></div>

<script src="js/api.js"></script>
<script src="js/charts.js"></script>
<script src="js/app.js"></script>
</body>
</html>

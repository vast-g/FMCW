server:
  port: 8080

spring:
  application:
    name: slope-platform

  # 与 Python Agent 侧共用同一个库 slope_agent。
  # connectionTimeZone 必须显式指定：不指定时驱动会按 JVM 默认时区解释 datetime，
  # 换一台机器部署就可能整体偏移 8 小时，而告警时间错 8 小时是致命的。
  datasource:
    url: jdbc:mysql://localhost:3306/slope_agent?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=Asia/Shanghai
    username: root
    password: Root@123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 建表用 schema.sql（幂等 IF NOT EXISTS），不用 ddl-auto：
  # 这个库里还有 Python 侧在用的表，让 Hibernate 去"自动对齐结构"风险不可控。
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  jpa:
    hibernate:
      # none：结构由 schema.sql 管，Hibernate 只负责读写。
      # 实体与既有表是否吻合，由测试 SlopePlatformApplicationTests 真查一次库来验证，
      # 而不是靠 validate 在启动时猜类型（float/datetime 的等价判断容易误报）。
      ddl-auto: none
    # 关掉 OSIV：避免 Web 层隐式持有长事务；本项目实体之间没有关联，也不需要延迟加载
    open-in-view: false
    # 不显式指定 hibernate.dialect：Hibernate 6.6 会自己从 JDBC 元数据识别出
    # MySQL 9.7.1 并选择 MySQLDialect（显式指定反而会触发 HHH90000025 废弃告警）。
    # 实测启动日志里 Database version: 9.7.1，识别正常。

  # 统一 snake_case：库里的列名、Python 侧的对象属性、以及需求里的 site_id/slope_group
  # 都是这个风格，接口跟着一致，前端和 Python 侧看同一份字段名就不会来回换算。
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: always

app:
  jwt:
    # HS256 要求密钥 >= 32 字节；本机默认值只为开箱即跑，
    # 真实部署必须用环境变量 SLOPE_JWT_SECRET 覆盖，绝不能把生产密钥提交进仓库。
    secret: ${SLOPE_JWT_SECRET:slope-platform-local-dev-secret-key-change-me-2026}
    expire-minutes: 120

logging:
  level:
    com.slope.platform: INFO
